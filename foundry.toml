[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Pinned so verified bytecode is reproducible and DACCell stays under the EIP-170 limit.
solc_version = "0.8.33"
evm_version = "prague"
optimizer = true
optimizer_runs = 1
fs_permissions = [
    { access = "read", path = "./script/config" },
    { access = "read-write", path = "./deployments" }
]

remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# CI uses this profile (FOUNDRY_PROFILE=ci); it inherits every default setting.
[profile.ci]

[lint]
exclude_lints = ["mixed-case-function", "asm-keccak256", "screaming-snake-case-immutable", "incorrect-shift", "mixed-case-variable", "pascal-case-struct"]
